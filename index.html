    <!--
      Aplicar el tema guardado ANTES de pintar la pagina para que no se vea
      un parpadeo del tema claro al recargar con el tema oscuro activo.
      Lee la misma clave de localStorage que usa next-themes
    -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (error) {
        /* localStorage bloqueado - se usa el tema por defecto */
      }
    </script>
